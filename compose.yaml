name: dineflow
services:
  api-migrate:
    image: dineflow-api-migrate:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate
    profiles: [api]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run pnpm setup:env}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
  api:
    image: dineflow-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    profiles: [api]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: "4000"
      APP_ORIGIN: ${APP_ORIGIN:?Run pnpm setup:env}
      DATABASE_URL: ${DATABASE_URL:?Run pnpm setup:env}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run pnpm setup:env}
      ACCOUNT_SECURITY_KEY: ${ACCOUNT_SECURITY_KEY:?Run pnpm setup:env}
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@dineflow.local}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      GUEST_TOKEN_TTL_SECONDS: ${GUEST_TOKEN_TTL_SECONDS:-14400}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-dineflow-menu}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run pnpm setup:env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run pnpm setup:env}
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/v1/health/ready', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: [storage, api]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:env}
      POSTGRES_DB: ${POSTGRES_DB:-dineflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm setup:env}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: dineflow-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    profiles: [storage, api]
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
  minio_data:
